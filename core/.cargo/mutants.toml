test_workspace = true
test_tool = "nextest"

# Exclude equivalent mutants by name with a reason when one is found.
#
# Equivalent: `>=` in the short-flag length check admits only a lone `-`,
# which has no `r`, `R` or `f` to set a recursive or force flag. Left on the
# operand branch it is not a root either, so the verdict is the same.
exclude_re = [
  """^crates/judgment/src/rules/shell_guard\\.rs:152:41: \
  replace > with >= in removes_root$""",
  # Equivalent: the log names are fixed inside a 0700 folder the user owns,
  # so a symlink_metadata error other than NotFound cannot be arranged there,
  # and every reachable case still resolves at open.
  """^crates/judgment/src/audit\\.rs:[0-9]+:[0-9]+: \
  replace match guard error\\.kind\\(\\) == io::ErrorKind::NotFound \
  with true in entry$""",
  # Equivalent: forced true, any create error falls through to
  # open_existing, which returns the file another process made (the
  # AlreadyExists case) or finds nothing and returns the same error.
  """^crates/judgment/src/audit\\.rs:[0-9]+:[0-9]+: \
  replace match guard error\\.kind\\(\\) == io::ErrorKind::AlreadyExists \
  with true in open_or_create$""",
]
