test_workspace = true
test_tool = "nextest"

# Exclude equivalent mutants by name with a reason when one is found.
#
# Equivalent: `>=` in the short-flag length check admits only a lone `-`,
# which has no `r`, `R` or `f` to set a recursive or force flag. Left on the
# operand branch it is not a root either, so the verdict is the same.
exclude_re = [
  """^crates/judgment/src/rules/shell_guard\\.rs:152:41: \
  replace > with >= in removes_root$""",
  # Equivalent: in append, a metadata failure other than NotFound is
  # followed by the same failure when the log is opened, so treating it as
  # NotFound returns the same error to the caller.
  """^crates/judgment/src/audit\\.rs:[0-9]+:[0-9]+: \
  replace match guard error\\.kind\\(\\) == io::ErrorKind::NotFound \
  with true in AuditLog::append$""",
]
