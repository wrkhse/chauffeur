name: Core release

# A tag such as core-v0.1.0-rc.1 names a release candidate of chauffeur-core,
# the Rust binary built from the chauffeur-cli package in the nested core
# workspace. `build` checks the tag against the package version, builds
# and smoke-tests the packed binary; `recording` films that binary
# judging a git status request in one pane and reading its audit entry in
# another; `release` attaches the tarballs, the demo GIF and SHA256SUMS
# to a GitHub prerelease that is never latest.
# `build-macos` also builds the macOS arm64 target for that release.
#
# A dispatch names an existing tag, films its published tarball and
# rebuilds the demo GIF and checksums for it.

on:
  push:
    tags: ["core-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to rebuild, such as core-v0.1.0-rc.1
        required: true
        type: string

# Each job asks for what it needs; only `release` writes.
permissions:
  contents: read

concurrency:
  group: core-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

env:
  TAG: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.tag
    || github.ref_name }}
  TARGET: x86_64-unknown-linux-gnu

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core
    steps:
      # A dispatch runs on a branch, so the tag is checked out by name.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: >- # v1
          dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.100.0
      - name: The tag names the chauffeur-cli version
        run: |
          set -euo pipefail

          version=$(cargo +1.100.0 metadata --locked --no-deps \
            --format-version 1 |
            jq -r '.packages[] | select(.name == "chauffeur-cli") | .version')
          [[ "$version" == "${TAG#core-v}" ]] || {
            echo "::error::chauffeur-cli is $version, the tag is $TAG"
            exit 1
          }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ARCHIVE=chauffeur-core-$version-$TARGET.tar.gz" >> "$GITHUB_ENV"
      - run: cargo +1.100.0 build --release --locked -p chauffeur-cli
      - name: Pack the binary
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/dist"
          tar -czf "$RUNNER_TEMP/dist/$ARCHIVE" \
            -C target/release chauffeur-core
          tar -tzvf "$RUNNER_TEMP/dist/$ARCHIVE"
      # Runs the binary from the tarball, outside the checkout, with a
      # scratch state folder; no installed chauffeur is touched.
      - name: Smoke-test the packed binary
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail

          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          tar -xzf "$RUNNER_TEMP/dist/$ARCHIVE" -C "$work"
          cd "$work"
          mkdir -p state
          export CHAUFFEUR_CORE_STATE_DIR="$work/state"

          printed=$(./chauffeur-core version)
          [[ "$printed" == "$VERSION" ]] || {
            echo "::error::version printed '$printed', the tag is $VERSION"
            exit 1
          }

          id=ci-allow
          request=$(jq -n --arg id "$id" '{
            id: $id, session: "ci", hook: "tool_after",
            subject: {tool: "shell", input: {command: "git status"}}
          }')

          judgment=$(printf '%s\n' "$request" | ./chauffeur-core judge)
          jq -e --arg id "$id" \
            '.request_id == $id and .verdict.outcome == "allow"' \
            <<< "$judgment"

          record=$(./chauffeur-core audit 1)
          jq -e --arg id "$id" \
            '.request_id == $id and .judgment.verdict.outcome == "allow"' \
            <<< "$record"
      - name: Upload the tarball
        uses: >- # v7.0.2
          actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: chauffeur-core-tarball
          path: ${{ runner.temp }}/dist/*.tar.gz
          if-no-files-found: error

  build-macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TARGET: aarch64-apple-darwin
    defaults:
      run:
        working-directory: core
    steps:
      # A dispatch runs on a branch, so the tag is checked out by name.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: >- # v1
          dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.100.0
          targets: aarch64-apple-darwin
      - name: The tag names the chauffeur-cli version
        run: |
          set -euo pipefail

          version=$(cargo +1.100.0 metadata --locked --no-deps \
            --format-version 1 |
            jq -r '.packages[] | select(.name == "chauffeur-cli") | .version')
          [[ "$version" == "${TAG#core-v}" ]] || {
            echo "::error::chauffeur-cli is $version, the tag is $TAG"
            exit 1
          }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ARCHIVE=chauffeur-core-$version-$TARGET.tar.gz" >> "$GITHUB_ENV"
      - run: >-
          cargo +1.100.0 build --release --locked -p chauffeur-cli
          --target "$TARGET"
      - name: Pack the binary
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/dist"
          tar -czf "$RUNNER_TEMP/dist/$ARCHIVE" \
            -C "target/$TARGET/release" chauffeur-core
          tar -tzvf "$RUNNER_TEMP/dist/$ARCHIVE"
      # Runs the binary from the tarball, outside the checkout, with a
      # scratch state folder; no installed chauffeur is touched.
      - name: Smoke-test the packed binary
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail

          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          tar -xzf "$RUNNER_TEMP/dist/$ARCHIVE" -C "$work"
          cd "$work"
          mkdir -p state
          export CHAUFFEUR_CORE_STATE_DIR="$work/state"

          printed=$(./chauffeur-core version)
          [[ "$printed" == "$VERSION" ]] || {
            echo "::error::version printed '$printed', the tag is $VERSION"
            exit 1
          }

          id=ci-allow
          request=$(jq -n --arg id "$id" '{
            id: $id, session: "ci", hook: "tool_after",
            subject: {tool: "shell", input: {command: "git status"}}
          }')

          judgment=$(printf '%s\n' "$request" | ./chauffeur-core judge)
          jq -e --arg id "$id" \
            '.request_id == $id and .verdict.outcome == "allow"' \
            <<< "$judgment"

          record=$(./chauffeur-core audit 1)
          jq -e --arg id "$id" \
            '.request_id == $id and .judgment.verdict.outcome == "allow"' \
            <<< "$record"
      - name: Upload the tarball
        uses: >- # v7.0.2
          actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: chauffeur-core-macos-tarball
          path: ${{ runner.temp }}/dist/*.tar.gz
          if-no-files-found: error

  # Films a packed binary in two panes that share one state directory. A
  # dispatch films the published tarball, so the demo and the checksums
  # describe the same bytes.
  # The judge pane pipes a git status request and prints the verdict; the
  # audit pane runs audit 1 in a fresh process and prints its record. The
  # two takes join into one GIF, a release asset only; it is never committed.
  recording:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # The frame matcher is sourced from the repository, so this job
      # needs the checkout even though it films a downloaded tarball.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the tarball
        uses: >- # v4.3.0
          actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: chauffeur-core-tarball
          path: ${{ runner.temp }}/dist
      - uses: >- # v1
          dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.100.0
      # terminal-control builds its Ghostty core with Zig 0.15.2.
      - name: Install Zig 0.15.2
        env:
          ZIG_SHA256: >-
            02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
        run: |
          set -euo pipefail

          url=https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/zig.tar.xz" "$url"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"
      # The runner's default font renders no glyphs in a termctrl video.
      # ImageMagick measures the exported GIF; Tesseract reads each take.
      - name: Install termctrl 1.2.1, ffmpeg, ImageMagick, Tesseract, DejaVu
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg fontconfig fonts-dejavu-core imagemagick \
            tesseract-ocr tesseract-ocr-eng
          family=$(fc-match -f '%{family}' 'DejaVu Sans Mono')
          [[ "$family" == *"DejaVu Sans Mono"* ]] || {
            echo "::error::fontconfig matched '$family' for DejaVu Sans Mono"
            exit 1
          }
          cargo +1.100.0 install terminal-control --version 1.2.1 --locked
          termctrl --version
      - name: Judge in one pane, audit in a fresh process in the other
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          source "$GITHUB_WORKSPACE/.github/scripts/frame-match.sh"

          work=$(mktemp -d)
          published=
          judge_live=
          audit_live=

          # A failing command in an EXIT trap must not hide the step's
          # result: cleanup keeps the incoming status unless it fails.
          cleanup() {
            local status=$1

            if [[ -n $judge_live ]] && ! termctrl stop judge; then
              echo "::error::termctrl stop judge failed"
              status=1
            fi

            if [[ -n $audit_live ]] && ! termctrl stop audit; then
              echo "::error::termctrl stop audit failed"
              status=1
            fi

            if ! rm -rf "$work"; then
              echo "::error::could not remove $work"
              status=1
            fi

            if [[ -n $published ]] && ! rm -rf "$published"; then
              echo "::error::could not remove $published"
              status=1
            fi

            return "$status"
          }
          trap 'status=$?; cleanup "$status" || status=1; exit "$status"' EXIT

          # A dispatch films the tarball published with the release: the
          # same bytes the release job checksums and keeps. A tag push
          # films the freshly built artifact from the build job.
          tarball=$(echo "$RUNNER_TEMP"/dist/*.tar.gz)
          [[ -f $tarball ]] || {
            echo "::error::no tarball in $RUNNER_TEMP/dist"
            exit 1
          }
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            published=$(mktemp -d)
            gh release download "$TAG" \
              --pattern "$(basename "$tarball")" --clobber --dir "$published"
            tarball="$published/$(basename "$tarball")"
          fi

          tar -xzf "$tarball" -C "$work"
          mkdir -p "$work/state" artifacts
          export CHAUFFEUR_CORE_STATE_DIR="$work/state"

          # The judge pane waits for a tap, judges one request and holds.
          cat > "$work/judge.sh" <<'SH'
          request=$(jq -nc '{id: "record-1", session: "ci",
            hook: "tool_after",
            subject: {tool: "shell", input: {command: "git status"}}}')
          printf '%s\n' "\$ printf '%s\\n' '$request' | ./chauffeur-core judge"
          read -r -s -t 120 _ || {
            echo "::error::judge pane timed out waiting for the go tap"
            exit 1
          }

          set -o pipefail
          printf '%s\n' "$request" | ./chauffeur-core judge \
            | jq -c '{request_id, verdict, trace}'
          status=$?
          if (( status != 0 )); then
            echo "::error::chauffeur-core judge exited $status, not 0"
            exit 1
          fi
          echo "chauffeur-core judge exited with $status"
          touch judged.flag
          read -r -s -t 120 _ || {
            echo "::error::judge pane timed out waiting for the stop tap"
            exit 1
          }
          SH

          # The audit pane waits for the verdict, then reads it with a
          # separate chauffeur-core process from the same state folder.
          cat > "$work/audit.sh" <<'SH'
          printf '%s\n' '$ ./chauffeur-core audit 1'
          read -r -s -t 120 _ || {
            echo "::error::audit pane timed out waiting for the go tap"
            exit 1
          }

          set -o pipefail
          found=
          for _ in {1..100}; do
            if [[ -f judged.flag ]]; then
              found=1
              break
            fi
            sleep 0.1
          done
          [[ -n $found ]] || {
            echo "the judge pane never recorded its verdict"
            exit 1
          }

          ./chauffeur-core audit 1 | jq -c '{at, request_id, judgment}'
          status=$?
          if (( status != 0 )); then
            echo "::error::chauffeur-core audit exited $status, not 0"
            exit 1
          fi
          echo "chauffeur-core audit exited with $status"
          read -r -s -t 120 _ || {
            echo "::error::audit pane timed out waiting for the stop tap"
            exit 1
          }
          SH

          termctrl start judge --record artifacts/judge.termctrl \
            --cols 120 --rows 24 --cwd "$work" -- bash ./judge.sh
          judge_live=1
          termctrl start audit --record artifacts/audit.termctrl \
            --cols 120 --rows 24 --cwd "$work" -- bash ./audit.sh
          audit_live=1

          # The same four moments are marked in both takes, so the edit
          # plan below cuts the two panes together.
          termctrl mark judge start
          termctrl mark audit start

          termctrl send judge text:go enter
          termctrl wait judge '"outcome":"allow"' --timeout 30000
          termctrl mark judge judged
          termctrl mark audit judged

          termctrl send audit text:go enter
          termctrl wait audit '"outcome":"allow"' --timeout 30000
          termctrl mark judge audited
          termctrl mark audit audited

          termctrl send judge text:stop enter
          termctrl wait judge 'chauffeur-core judge exited with' \
            --timeout 10000
          termctrl send audit text:stop enter
          termctrl wait audit 'chauffeur-core audit exited with' \
            --timeout 10000
          termctrl mark judge end
          termctrl mark audit end

          judge_log=$(termctrl logs judge | tr -d '\r\n')
          audit_log=$(termctrl logs audit | tr -d '\r\n')
          [[ $judge_log == *'"request_id":"record-1"'* ]] || {
            echo "::error::the judge pane shows no request id"
            exit 1
          }
          [[ $audit_log == *'"request_id":"record-1"'* ]] || {
            echo "::error::the audit pane shows no request id"
            exit 1
          }
          [[ $audit_log == *'"outcome":"allow"'* ]] || {
            echo "::error::the audit pane shows no allow verdict"
            exit 1
          }
          termctrl stop judge
          judge_live=
          termctrl stop audit
          audit_live=

          # Samples each clip in the edit plan, not a shared marker. Each
          # assertion names text unique to its take: the verdict in the
          # judge take, the audit entry in the audit take, so one take
          # cannot stand in for the other. The audit judged..audited clip
          # samples near its end: the midpoint can land in the judged.flag
          # wait before the audit process prints its judgment.
          frame_shows() {
            local recording=$1 from=$2 to=$3 expected=$4 frac=${5:-0.5}
            local at frame
            at=$(termctrl markers --json "$recording" | jq -r \
              --arg from "$from" --arg to "$to" --argjson frac "$frac" '
              (map({key: .name, value: .at_ms}) | from_entries) as $marks
              | ($marks[$from]
                 + ($marks[$to] - $marks[$from]) * $frac
                 | floor | tostring)')
            frame=$(termctrl show --recording "$recording" --at-ms "$at")
            printf -- '--- %s %s..%s at %sms ---\n%s\n' \
              "$recording" "$from" "$to" "$at" "$frame"
            if ! frame_matches "$frame" "$expected"; then
              echo "::error::$recording $from..$to does not show $expected"
              return 1
            fi
          }

          frame_shows artifacts/judge.termctrl start judged \
            '"command":"git status"'
          frame_shows artifacts/judge.termctrl judged audited \
            'literal git status with only plain flags'
          frame_shows artifacts/judge.termctrl audited end \
            'literal git status with only plain flags'
          frame_shows artifacts/audit.termctrl start judged \
            '$ ./chauffeur-core audit 1'
          frame_shows artifacts/audit.termctrl judged audited \
            '"judgment":' 0.95
          frame_shows artifacts/audit.termctrl audited end \
            '"judgment":'

          termctrl markers artifacts/judge.termctrl
          termctrl markers artifacts/audit.termctrl
      # Each take exports with captions and holds, the two join into one
      # clip, and the clip becomes a GIF of at most 1200 pixels wide and
      # 3 MB. The audit take's 3.5 second tail is the GIF's final hold.
      - name: Export the demo GIF
        run: |
          set -euo pipefail

          cat > artifacts/judge-edit.json <<'JSON'
          {
            "clips": [
              {
                "from": "start",
                "to": "judged",
                "caption": "Judge pane: git status goes to chauffeur-core judge",
                "hold_ms": 2500
              },
              {
                "from": "judged",
                "to": "audited",
                "caption": "Verdict allow: literal git status with only plain flags",
                "hold_ms": 2500
              },
              {
                "from": "audited",
                "to": "end",
                "caption": "Verdict log line stays; judge exited with 0",
                "hold_ms": 2500
              }
            ]
          }
          JSON
          cat > artifacts/audit-edit.json <<'JSON'
          {
            "clips": [
              {
                "from": "start",
                "to": "judged",
                "caption": "Audit pane: a fresh process runs chauffeur-core audit 1",
                "hold_ms": 2500
              },
              {
                "from": "judged",
                "to": "audited",
                "caption": "Audit entry: the same request id and an allow verdict",
                "hold_ms": 2500
              },
              {
                "from": "audited",
                "to": "end",
                "caption": "The audit log line stays on screen; audit exited with 0",
                "hold_ms": 2500
              }
            ]
          }
          JSON

          for take in judge audit; do
            termctrl video "artifacts/$take.termctrl" \
              --edit "artifacts/$take-edit.json" --footer --fps 10 \
              --font-family "DejaVu Sans Mono" \
              --tail-ms 3500 --out "artifacts/demo-$take.mp4"
          done
          ls -l artifacts/*.mp4

          # OCR reads every frame of each exported take at 1 fps with the
          # footer cropped, then concatenates the text. The judge take must
          # show the printed request's "command":"gitstatus" along with
          # the request_id and trace keys and the record-1 request id from
          # the judge binary's own JSON: the caption's allow verdict also
          # says git status, and record-1 is the request id, so neither
          # proves the request line was read. The audit take must show its
          # judgment key. A whole line go or stop must be absent because
          # the reads are silent. The frame that shows the marker is
          # measured too: a rendered frame of text has grayscale
          # deviation >= 0.02, so a dark export fails even when a later
          # hold is bright.
          for take in judge audit; do
            frames_dir=$(mktemp -d)
            ffmpeg -hide_banner -loglevel error -y \
              -i "artifacts/demo-$take.mp4" \
              -vf 'fps=1,crop=iw:ih*3/4:0:0,format=gray,negate' \
              "$frames_dir/frame-%05d.png"
            shopt -s nullglob
            frames=("${frames_dir}"/*.png)
            shopt -u nullglob
            if (( ${#frames[@]} == 0 )); then
              echo "::error::demo-$take.mp4 yielded no frames for OCR"
              exit 1
            fi

            text=
            shown=
            rendered=
            for frame in "${frames[@]}"; do
              frame_text=$(tesseract "$frame" stdout)
              text+=$frame_text
              frame_flat=$(tr -d '[:space:]' \
                <<< "$frame_text" | tr '[:upper:]' '[:lower:]')
              if [[ $take == judge ]]; then
                [[ $frame_flat == *'"command":"gitstatus"'* \
                  && $frame_flat == *request_id* \
                  && $frame_flat == *trace* \
                  && $frame_flat == *record-1* ]] \
                  || continue
              else
                [[ $frame_flat == *judgment* ]] || continue
              fi
              shown=1
              deviation=$(convert "$frame" -colorspace Gray \
                -format '%[fx:standard_deviation]' info:)
              echo "demo-$take.mp4 output frame deviation: $deviation"
              if awk -v d="$deviation" 'BEGIN { exit !(d >= 0.02) }'; then
                rendered=1
              fi
            done
            printf -- '--- OCR of demo-%s.mp4 frames ---\n%s\n' "$take" "$text"
            if has_control_line "$text"; then
              echo "::error::demo-$take.mp4 echoes a go or stop line"
              exit 1
            fi
            if [[ -z $shown ]]; then
              if [[ $take == judge ]]; then
                echo "::error::demo-judge.mp4 shows no printed request"
              else
                echo "::error::demo-audit.mp4 shows no audit record"
              fi
              exit 1
            fi
            if [[ -z $rendered ]]; then
              echo "::error::demo-$take.mp4's output frame is blank"
              exit 1
            fi
            rm -rf -- "$frames_dir"
          done

          # Both takes have the same terminal size, so their frames match.
          ffmpeg -hide_banner -loglevel error -y \
            -i artifacts/demo-judge.mp4 -i artifacts/demo-audit.mp4 \
            -filter_complex '[0:v][1:v]concat=n=2:v=1:a=0[v]' -map '[v]' \
            -c:v libx264 -pix_fmt yuv420p artifacts/demo.mp4

          # Narrower takes until one fits under 3 MB; none fitting fails.
          limit=$((3 * 1000 * 1000))
          size=$limit
          for width in 1200 1000 800; do
            filter="fps=10,scale='min($width,iw)':-2:flags=lanczos,split[a][b]"
            filter+=";[a]palettegen=stats_mode=diff[p]"
            filter+=";[b][p]paletteuse=dither=bayer:bayer_scale=5"
            filter+=":diff_mode=rectangle"
            ffmpeg -hide_banner -loglevel error -y -i artifacts/demo.mp4 \
              -filter_complex "$filter" -loop 0 artifacts/demo.gif
            size=$(stat -c %s artifacts/demo.gif)
            echo "demo.gif at most $width pixels wide: $size bytes"
            if (( size < limit )); then
              break
            fi
          done

          if (( size >= limit )); then
            echo "::error::demo.gif is $size bytes even at 800 pixels wide"
            exit 1
          fi

          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height:format=duration \
            -of default=noprint_wrappers=1 artifacts/demo.gif
          gif_width=$(ffprobe -v error -select_streams v:0 \
            -show_entries stream=width -of csv=p=0 artifacts/demo.gif)
          if (( gif_width > 1200 )); then
            echo "::error::demo.gif is $gif_width pixels wide"
            exit 1
          fi

          # The blank-GIF guard reads the exported GIF itself. Every frame
          # is extracted at 1 fps with the footer cropped, OCRed and joined.
          # The judge take shows the printed request's
          # "command":"gitstatus" and the request_id and trace keys and the
          # record-1 request id from the binary's JSON: the caption's allow
          # verdict also says git status, and record-1 is the request id,
          # so neither proves the request line is present. The audit take
          # shows its judgment key. Neither take may show a whole line go
          # or stop: the reads are silent. Finding both proves both takes
          # are present. Whitespace OCR inserts inside a word is dropped.
          gif_frames=$(mktemp -d)
          ffmpeg -hide_banner -loglevel error -y -i artifacts/demo.gif \
            -vf 'fps=1,crop=iw:ih*3/4:0:0,format=gray,negate' \
            "$gif_frames/frame-%05d.png"
          shopt -s nullglob
          frames=("${gif_frames}"/*.png)
          shopt -u nullglob
          if (( ${#frames[@]} == 0 )); then
            echo "::error::demo.gif yielded no frames for OCR"
            exit 1
          fi

          gif_text=$(for frame in "${frames[@]}"; do
            tesseract "$frame" stdout
          done)
          printf -- '--- OCR of demo.gif frames ---\n%s\n' "$gif_text"
          flat=$(tr -d '[:space:]' <<< "$gif_text" | tr '[:upper:]' '[:lower:]')
          if [[ $flat != *'"command":"gitstatus"'* ]]; then
            echo "::error::OCR finds no printed request in demo.gif"
            exit 1
          fi
          if [[ $flat != *request_id* || $flat != *trace* \
            || $flat != *record-1* ]]; then
            echo "::error::OCR finds no judge JSON keys in demo.gif"
            exit 1
          fi
          if has_control_line "$gif_text"; then
            echo "::error::OCR finds a go or stop line in demo.gif"
            exit 1
          fi
          if [[ $flat != *judgment* || $flat != *record-1* ]]; then
            echo "::error::OCR finds no audit record in demo.gif"
            exit 1
          fi
          rm -rf -- "$gif_frames"

          # Secondary guard: the final hold shows the audit take's output.
          # A frame of text measures about 0.04 or more in grayscale
          # standard deviation (0 to 1); a dark frame with only a cursor,
          # about 0.01. Below 0.02 the GIF rendered no glyphs.
          ffmpeg -hide_banner -loglevel error -y -sseof -1 \
            -i artifacts/demo.gif -frames:v 1 artifacts/demo-last.png
          deviation=$(convert artifacts/demo-last.png -colorspace Gray \
            -format '%[fx:standard_deviation]' info:)
          echo "demo.gif final frame grayscale deviation: $deviation"
          if ! awk -v d="$deviation" 'BEGIN { exit !(d >= 0.02) }'; then
            echo "::error::demo.gif's final frame is blank (deviation $deviation)"
            exit 1
          fi
      - name: Upload the demo GIF
        uses: >- # v7.0.2
          actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: core-demo
          path: artifacts/demo.gif
          if-no-files-found: error

  release:
    needs: [build, build-macos, recording]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the tarball
        uses: >- # v4.3.0
          actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: chauffeur-core-tarball
          path: ${{ runner.temp }}/release
      - name: Download the macOS tarball
        uses: >- # v4.3.0
          actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: chauffeur-core-macos-tarball
          path: ${{ runner.temp }}/release
      - name: Download the demo
        uses: >- # v4.3.0
          actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: core-demo
          path: ${{ runner.temp }}/release
      # A dispatch keeps the published tarballs, so the rebuilt ones give
      # way to the release's own copies and the sums cover what is attached.
      - name: Write SHA256SUMS
        working-directory: ${{ runner.temp }}/release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          tarballs=(*.tar.gz)
          if (( ${#tarballs[@]} != 2 )); then
            echo "::error::expected two tarballs, found ${tarballs[*]}"
            exit 1
          fi
          echo "TARBALLS=${tarballs[*]}" >> "$GITHUB_ENV"

          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            names=$(gh api "repos/$GH_REPO/releases/tags/$TAG" \
              --jq '.assets[].name') || {
              echo "::error::dispatch cannot view release $TAG"
              exit 1
            }
            for tarball in "${tarballs[@]}"; do
              if [[ $'\n'$names$'\n' != *$'\n'"$tarball"$'\n'* ]]; then
                if [[ $tarball == *aarch64-apple-darwin.tar.gz ]]; then
                  gh release upload "$TAG" --clobber -- "$tarball"
                  echo "::notice::added macOS asset $tarball to release $TAG"
                else
                  echo "::error::release $TAG has no asset $tarball"
                  exit 1
                fi
              else
                rm -- "$tarball"
                gh release download "$TAG" --pattern "$tarball" --dir .
              fi
            done
            tarballs=(*.tar.gz)
          fi

          sha256sum -- "${tarballs[@]}" demo.gif > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the GitHub prerelease
        working-directory: ${{ runner.temp }}/release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          notes="Core candidates of chauffeur-core, the Rust core, for"
          notes+=" macOS arm64 and x86_64 Linux. Check the tarballs against"
          notes+=" SHA256SUMS, unpack the one for your platform and run"
          notes+=" chauffeur-core version. demo.gif shows this packed binary"
          notes+=" allowing git status in one pane and reading the audit"
          notes+=" entry with a fresh process in the other. This is a"
          notes+=" prerelease and is never marked latest."

          # A dispatch re-records the demo of a published tag, so it
          # replaces the GIF and the SHA256SUMS that covers it and leaves
          # the tarballs as they were.
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            assets=(SHA256SUMS demo.gif)
          else
            read -r -a tarballs <<< "$TARBALLS"
            assets=("${tarballs[@]}" SHA256SUMS demo.gif)
          fi

          # A rerun or a dispatch finds the release already made: the assets
          # are replaced and the tag is edited back into a prerelease that
          # is never latest, in case it was made normal or latest. Notes are
          # left as they are, so a maintainer's edits survive a dispatch.
          # Only a new release is created with fresh notes. The installed
          # chauffeur, Homebrew and npm are never touched.
          if gh release view "$TAG" > /dev/null; then
            gh release upload "$TAG" --clobber -- "${assets[@]}"
            gh release edit "$TAG" --prerelease --latest=false
          else
            gh release create "$TAG" --prerelease --latest=false --verify-tag \
              --title "chauffeur-core $TAG" --notes "$notes" \
              -- "${assets[@]}"
          fi
