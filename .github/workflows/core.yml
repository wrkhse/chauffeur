name: Check core

on:
  push:
    branches: [main, feat/core-slice-1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install nightly-2026-10-25 --profile minimal \
            --component rustfmt --component clippy
          rustup show active-toolchain
      - run: cargo +nightly-2026-10-25 fmt --all -- --check
      - run: >-
          cargo +nightly-2026-10-25 clippy --workspace --all-targets
          --all-features --locked -- -D warnings
      # v2.90.4
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21
        with:
          tool: cargo-nextest@0.9.152
      - run: >-
          cargo +nightly-2026-10-25 nextest run --workspace
          --all-features --locked
      - run: cargo +nightly-2026-10-25 test --doc --workspace --locked
      - run: cargo +nightly-2026-10-25 doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # v2.90.4
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21
        with:
          tool: cargo-deny@0.22.0
      - run: cargo +nightly-2026-10-25 deny check

  mutants:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Rust toolchain
        run: >-
          rustup toolchain install nightly-2026-10-25 --profile minimal
          --component rustfmt --component clippy
      # v2.90.4
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21
        with:
          tool: cargo-mutants@27.1.0
      # v2.90.4
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21
        with:
          tool: cargo-nextest@0.9.152
      - name: The pull request's diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: >-
          git -C .. diff --relative=core "$BASE"...HEAD -- core
          > "$RUNNER_TEMP/pr.diff"
      - run: >-
          cargo +nightly-2026-10-25 mutants --in-diff "$RUNNER_TEMP/pr.diff"
          --no-shuffle -j 2 -vV
      - name: What was tested
        if: always()
        run: |
          outcomes="$GITHUB_WORKSPACE/core/mutants.out/outcomes.json"
          if [ -f "$outcomes" ]; then
            jq -r '
              "- Tested: \(.total_mutants)",
              "- Caught: \(.caught)",
              "- Missed: \(.missed)",
              "- Timeout: \(.timeout)",
              "- Unviable: \(.unviable)"
            ' "$outcomes" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'none in this diff' >> "$GITHUB_STEP_SUMMARY"
          fi
      # v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          path: core/mutants.out
          if-no-files-found: ignore
