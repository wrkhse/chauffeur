name: Check core

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_tree:
        description: Run all mutants, including those outside the pull request diff
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: check-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: "${{ github.ref != 'refs/heads/main' }}"

jobs:
  core-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          set -euo pipefail
          toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$toolchain"
          printf 'TOOLCHAIN=%s\n' "$toolchain" >> "$GITHUB_ENV"
          rustup toolchain install "$toolchain" --profile minimal \
            --component rustfmt --component clippy
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ hashFiles('core/Cargo.lock', 'core/rust-toolchain.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: "core -> target"
      - name: Check MSRV
        run: |
          set -euo pipefail
          rustup toolchain install 1.100.0 --profile minimal
          cargo +1.100.0 check --workspace --all-targets --locked
      - run: cargo +"$TOOLCHAIN" fmt --all -- --check
      - run: >-
          cargo +"$TOOLCHAIN" clippy --workspace --all-targets
          --all-features --locked -- -D warnings
      # v2.90.4
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21
        with:
          tool: cargo-nextest@0.9.152
      - run: >-
          cargo +"$TOOLCHAIN" nextest run --workspace
          --all-features --locked
      - run: >-
          cargo +"$TOOLCHAIN" nextest run -p chauffeur-cli
          --test cli --run-ignored only --locked
      - run: cargo +"$TOOLCHAIN" test --doc --workspace --locked
      - run: cargo +"$TOOLCHAIN" doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # v2.90.4
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21
        with:
          tool: cargo-deny@0.20.2
      - run: cargo +"$TOOLCHAIN" deny check
      - name: Smoke test the release CLI
        run: |
          set -euo pipefail
          cargo +"$TOOLCHAIN" build --release --locked -p chauffeur-cli
          cd "$GITHUB_WORKSPACE"

          state_dir=$(mktemp -d "$RUNNER_TEMP/chauffeur-core.XXXXXX")
          export CHAUFFEUR_CORE_STATE_DIR="$state_dir"
          binary=core/target/release/chauffeur-core

          # judge ID TOOL KEY VALUE OUTCOME: one run, one expected verdict.
          judge() {
            jq -n --arg id "$1" --arg tool "$2" --arg key "$3" \
              --arg value "$4" '{
                id: $id, session: "ci", hook: "tool_after",
                subject: {tool: $tool, input: {($key): $value}}
              }' \
              | "$binary" judge \
              | jq -e --arg id "$1" --arg outcome "$5" \
                '.request_id == $id and .verdict.outcome == $outcome'
          }

          judge ci-allow shell command 'git status' allow
          judge ci-ask read path \~/.ssh/id_ed25519 ask
          judge ci-deny shell command 'rm -rf /' deny

          # A fresh process reads back what the three runs recorded.
          "$binary" audit 3 | jq -e -s '
            map([.request_id, .judgment.verdict.outcome]) == [
              ["ci-allow", "allow"], ["ci-ask", "ask"], ["ci-deny", "deny"]
            ]
          '
      - name: Frame guard survives terminal wraps
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/test-frame-guard.sh

  core-mutants-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: core
    env:
      FULL_TREE: ${{ github.ref == 'refs/heads/main' || inputs.full_tree }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Rust toolchain
        run: |
          set -euo pipefail
          toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$toolchain"
          printf 'TOOLCHAIN=%s\n' "$toolchain" >> "$GITHUB_ENV"
          rustup toolchain install "$toolchain" --profile minimal \
            --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ hashFiles('core/Cargo.lock', 'core/rust-toolchain.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: "core -> target"
      # v2.90.4
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21
        with:
          tool: cargo-mutants@27.1.0
      # v2.90.4
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21
        with:
          tool: cargo-nextest@0.9.152
      - name: The pull request's diff
        if: env.FULL_TREE != 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: >-
          git -C .. diff --relative=core "$BASE"...HEAD -- '*.rs'
          > "$RUNNER_TEMP/pr.diff"
      - name: Mutants
        run: |
          set -euo pipefail

          args=(--no-shuffle -j 2 --shard "$SHARD/4")
          if [[ $FULL_TREE != true ]]; then
            args+=(--in-diff "$RUNNER_TEMP/pr.diff")
          fi

          cargo +"$TOOLCHAIN" mutants "${args[@]}" -vV -- --run-ignored all

          outcomes=mutants.out/outcomes.json
          if [ ! -f "$outcomes" ]; then
            if ! listed=$(cargo +"$TOOLCHAIN" mutants --list "${args[@]}"); then
              echo "::error::cargo mutants --list failed in shard $SHARD"
              exit 1
            fi
            if [ -z "$listed" ]; then
              mkdir -p mutants.out
              jq -n '{total_mutants: 0, caught: 0, missed: 0, timeout: 0, unviable: 0}' > "$outcomes"
            else
              echo "::error::shard $SHARD listed mutants but wrote no outcomes.json"
              exit 1
            fi
          fi
      - name: Check outcomes
        if: always()
        run: |
          set -euo pipefail
          outcomes=mutants.out/outcomes.json
          if [ ! -f "$outcomes" ]; then
            echo "::error::shard $SHARD produced no outcomes.json"
            exit 1
          fi
          if ! jq -e '.missed == 0 and .timeout == 0' "$outcomes" > /dev/null; then
            echo "::error::shard $SHARD has missed or timed out mutants"
            exit 1
          fi
      - name: What was tested
        if: always()
        run: |
          set -euo pipefail
          outcomes="$GITHUB_WORKSPACE/core/mutants.out/outcomes.json"
          if [ -f "$outcomes" ]; then
            jq -r '"- Tested: \(.total_mutants)", "- Caught: \(.caught)", "- Missed: \(.missed)", "- Timeout: \(.timeout)", "- Unviable: \(.unviable)"' "$outcomes" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'none in this diff' >> "$GITHUB_STEP_SUMMARY"
          fi
      # v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: core-mutants-shard-${{ matrix.shard }}
          path: core/mutants.out/outcomes.json
          if-no-files-found: error

  core-mutants:
    needs: [core-mutants-shard]
    if: always()
    runs-on: ubuntu-latest
    env:
      FULL_TREE: ${{ github.ref == 'refs/heads/main' || inputs.full_tree }}
    steps:
      # v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: core-mutants-shard-*
          path: ${{ runner.temp }}/mutants
      - name: Check shard outcomes
        env:
          RESULT: ${{ needs.core-mutants-shard.result }}
        run: |
          set -euo pipefail

          if [[ $RESULT != success ]]; then
            echo "::error::mutants shards result is $RESULT"
            exit 1
          fi

          dir="$RUNNER_TEMP/mutants"
          shopt -s nullglob
          files=("$dir"/core-mutants-shard-*/outcomes.json)
          shopt -u nullglob
          if (( ${#files[@]} != 4 )); then
            echo "::error::expected 4 shard outcomes.json files, found ${#files[@]}"
            exit 1
          fi

          tested=0
          caught=0
          for file in "${files[@]}"; do
            if ! jq -e '.missed == 0 and .timeout == 0' "$file" > /dev/null; then
              echo "::error::$(basename "$(dirname "$file")") has missed or timed out mutants"
              exit 1
            fi
            read -r part_tested part_caught < <(jq -r '[.total_mutants, .caught] | @tsv' "$file")
            tested=$((tested + part_tested))
            caught=$((caught + part_caught))
          done

          printf -- '- Shards: %s\n- Tested: %s\n- Caught: %s\n- Missed: 0\n- Timeout: 0\n' "${#files[@]}" "$tested" "$caught" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Rust toolchain
        working-directory: core
        run: |
          set -euo pipefail
          toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$toolchain"
          printf 'TOOLCHAIN=%s\n' "$toolchain" >> "$GITHUB_ENV"
          rustup toolchain install "$toolchain" --profile minimal \
            --component rustfmt --component clippy
      # v2.90.4
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21
        with:
          tool: cargo-mutants@27.1.0
      - name: The pull request's diff
        if: env.FULL_TREE != 'true'
        working-directory: core
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: >-
          git -C .. diff --relative=core "$BASE"...HEAD -- '*.rs'
          > "$RUNNER_TEMP/pr.diff"
      - name: Verify mutant coverage
        working-directory: core
        run: |
          set -euo pipefail

          dir="$RUNNER_TEMP/mutants"
          files=("$dir"/core-mutants-shard-*/outcomes.json)

          summed=0
          for file in "${files[@]}"; do
            part=$(jq -r '.total_mutants' "$file")
            summed=$((summed + part))
          done

          args=(--no-shuffle -j 2)
          if [[ $FULL_TREE != true ]]; then
            args+=(--in-diff "$RUNNER_TEMP/pr.diff")
          fi

          if ! listed=$(cargo +"$TOOLCHAIN" mutants --list "${args[@]}"); then
            echo "::error::cargo mutants --list failed"
            exit 1
          fi

          listed_count=0
          if [ -n "$listed" ]; then
            listed_count=$(printf '%s\n' "$listed" | wc -l)
          fi

          if (( summed != listed_count )); then
            echo "::error title=mutant-coverage::shards tested $summed mutants but the unsharded list has $listed_count"
            exit 1
          fi
