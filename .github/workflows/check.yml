name: Check

on:
  push:
    branches: [v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      # -D warnings reaches rustc and clippy only; this fails Cargo's own lints too.
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the nightly and its components; rustup installs them here.
      - run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p chauffeur-judges --no-default-features --all-targets --locked -- -D warnings
      - run: cargo clippy -p chauffeur-playground --target wasm32-unknown-unknown --locked -- -D warnings
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-nextest@0.9.152
      - run: cargo nextest run --workspace --locked
      # The CLI's process tests start and stop a daemon or pipe it through head,
      # so they are #[ignore]d locally and run here.
      - run: cargo nextest run -p chauffeur-cli --test navigate --run-ignored only --locked
      - run: cargo test --doc --workspace --locked
      # Each benchmark once, so they keep building and running; timings are compared locally.
      - run: cargo bench --workspace --bench '*' --locked -- -benchtime 1x -count 1

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The rust-version in Cargo.toml, exactly; the pinned nightly stays for the rest.
      - run: rustup toolchain install 1.100.0 --profile minimal --target wasm32-unknown-unknown
      - run: cargo +1.100.0 check --workspace --all-targets --locked
      - run: cargo +1.100.0 check -p chauffeur-judges --no-default-features --all-targets --locked
      - run: cargo +1.100.0 check -p chauffeur-playground --target wasm32-unknown-unknown --locked

  # The proofs run on GitHub's disposable runners, never on a developer's
  # machine: they execute generated code and the tests spawn processes.
  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo miri setup
      - run: cargo miri test -p chauffeur-core --locked
      - run: cargo miri test -p chauffeur-runtime --test admission --locked
        env:
          # The pool's detached idle workers end once the pool drops.
          MIRIFLAGS: -Zmiri-ignore-leaks

  kani:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KANI_VERSION: 0.68.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Kani brings its own nightly, nightly-2026-08-21 for 0.68.0; the pinned
      # one stays for the rest.
      - run: cargo install --locked kani-verifier --version "$KANI_VERSION"
      - run: cargo kani setup
      # A run that verifies no harness proves nothing, so it fails too.
      - name: cargo kani -p chauffeur-judges
        run: |
          set -o pipefail
          cargo kani -p chauffeur-judges | tee kani.log
          grep -Eq 'Complete - [1-9][0-9]* successfully verified harnesses, 0 failures' kani.log
      - name: cargo kani -p chauffeur-runtime
        run: |
          set -o pipefail
          cargo kani -p chauffeur-runtime | tee kani-runtime.log
          grep -Eq 'Complete - [1-9][0-9]* successfully verified harnesses, 0 failures' kani-runtime.log

  # Every viable mutant in the lines a pull request changes must be caught;
  # an equivalent one is excluded in .cargo/mutants.toml, with why.
  mutants:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.152
      - name: The pull request's diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: git diff "$BASE"...HEAD -- '*.rs' > pr.diff
      # A missed mutant or a timeout fails. One that truly hangs the tests is
      # excluded by name in .cargo/mutants.toml, with its reason.
      - run: cargo mutants --in-diff pr.diff --no-shuffle -j 2 -vV
      - name: What was tested
        if: always()
        run: |
          {
            echo "### Mutants"
            if [ -f mutants.out/outcomes.json ]; then
              jq -r '"- tested: \(.total_mutants)", "- caught: \(.caught)", "- missed: \(.missed)", "- timeouts: \(.timeout)", "- unviable: \(.unviable)"' mutants.out/outcomes.json
            else
              echo "- none in this diff"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants.out
          path: mutants.out
          if-no-files-found: ignore

  opencode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/opencode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run check

  playground:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      # rust-toolchain.toml pins the nightly and the wasm32 target wasm-pack
      # builds for; rustup installs them here.
      - run: rustup show active-toolchain
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: wasm-pack@0.15.0
      - run: bun install --frozen-lockfile
      # wasm-pack optimises with a wasm-opt found on PATH before downloading
      # one of its own, and the binary it downloads rejects the toolchain's
      # --enable-bulk-memory-opt; binaryen 133 is the release that knows it.
      - name: binaryen version_133, so wasm-pack's wasm-opt knows the toolchain's flags
        env:
          # Pinned from the release's .sha256 file, so the download is checked
          # without fetching that file at run time.
          BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/binaryen-version_133-x86_64-linux.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz"
          echo "$BINARYEN_SHA256  $tarball" | sha256sum --check
          tar -xzf "$tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"
      # wasm-pack takes the wasm-opt first on PATH, which is the binaryen above.
      - name: bun run check
        run: |
          set -euo pipefail
          wasm-opt --version 2>&1 | grep -F 'version 133'
          bun run check

  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - run: node --test scripts/*.test.mjs
      - run: cargo build --release --locked -p chauffeur-cli
      - name: Build the OpenCode adapter
        working-directory: adapters/opencode
        run: bun install --frozen-lockfile && bun run build
      - name: Package the tarball
        shell: bash
        run: |
          set -euo pipefail
          target=$(node -p 'process.platform + "-" + process.arch')
          node scripts/package.mjs tarball --target "$target" --binary target/release/chauffeur --out dist
          node scripts/package.mjs sums dist
      - name: Smoke the packaged tarball
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smoke.mjs dist/chauffeur-*.tar.gz
