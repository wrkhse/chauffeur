[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  # The benchmark harness, a dev-dependency pinned to one commit.
  "https://github.com/bwplotka/benchfmt.rs",
  # rungs, core's step machine, pinned to its tag.
  "https://github.com/wrkhse/rungs",
]
